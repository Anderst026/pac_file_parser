[project]
name = "pac-file-parser"
version = "0.1.0"
description = "Extract FindProxyForURL function and helper DNS helpers from a PAC file text for offline inspection."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
